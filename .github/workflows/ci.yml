name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novaerp
          POSTGRES_USER: novaerp
          POSTGRES_PASSWORD: novaerp
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: novaerp-backend
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: novaerp
          DB_USER: novaerp
          DB_PASSWORD: novaerp
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: novaerp-frontend/package-lock.json

      - name: Install dependencies
        working-directory: novaerp-frontend
        run: npm ci

      - name: Lint
        working-directory: novaerp-frontend
        run: npm run lint

      - name: Typecheck
        working-directory: novaerp-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: novaerp-frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker:
    name: Docker Build & Package Verification
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./novaerp-backend
          file: ./novaerp-backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/novaerp-backend:latest
            ghcr.io/${{ github.repository_owner }}/novaerp-backend:${{ github.sha }}

      - name: Build and verify Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./novaerp-frontend
          file: ./novaerp-frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8081/api' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/novaerp-frontend:latest
            ghcr.io/${{ github.repository_owner }}/novaerp-frontend:${{ github.sha }}

  azure-deploy:
    name: Azure Staging Deployment (Prepared)
    needs: [docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && false # Enable once AZURE_CREDENTIALS secret is added in repository settings
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Containers to Azure
        run: |
          echo "Automated Azure deployment step prepared."
