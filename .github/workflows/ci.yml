name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novaerp
          POSTGRES_USER: novaerp
          POSTGRES_PASSWORD: novaerp
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: novaerp-backend
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: novaerp
          DB_USER: novaerp
          DB_PASSWORD: novaerp
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: novaerp-frontend/package-lock.json

      - name: Install dependencies
        working-directory: novaerp-frontend
        run: npm ci

      - name: Lint
        working-directory: novaerp-frontend
        run: npm run lint

      - name: Typecheck
        working-directory: novaerp-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: novaerp-frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker:
    name: Docker Build & Push to ACR
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./novaerp-backend
          file: ./novaerp-backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-backend:${{ github.sha }}

      - name: Build and push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./novaerp-frontend
          file: ./novaerp-frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://novaerp-backend.delightfulmeadow-ea55eef5.swedencentral.azurecontainerapps.io/api' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-frontend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-frontend:${{ github.sha }}

  azure-deploy:
    name: Azure Production Deployment & Smoke Test
    needs: [docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend Container App
        run: |
          az containerapp update \
            --name novaerp-backend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-backend:${{ github.sha }}

      - name: Deploy Frontend Container App
        run: |
          az containerapp update \
            --name novaerp-frontend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/novaerp-frontend:${{ github.sha }}

      - name: Production Smoke Test
        run: |
          echo "Fetching Container App FQDNs..."
          BACKEND_FQDN=$(az containerapp show --name novaerp-backend --resource-group ${{ secrets.AZURE_RG }} --query "properties.configuration.ingress.fqdn" -o tsv)
          FRONTEND_FQDN=$(az containerapp show --name novaerp-frontend --resource-group ${{ secrets.AZURE_RG }} --query "properties.configuration.ingress.fqdn" -o tsv)
          
          echo "Backend FQDN: https://${BACKEND_FQDN}"
          echo "Frontend FQDN: https://${FRONTEND_FQDN}"
          
          echo "Checking Backend Health Endpoint..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_FQDN}/actuator/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy!"
              break
            fi
            sleep 5
          done
          
          if [ "$STATUS" != "200" ]; then
            echo "Backend health check failed with status $STATUS"
            exit 1
          fi

          echo "Checking Frontend Homepage..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FRONTEND_FQDN}/")
          echo "Frontend HTTP status: $FRONTEND_STATUS"
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "Frontend check failed with status $FRONTEND_STATUS"
            exit 1
          fi
          
          echo "Azure Production Smoke Test Succeeded!"
